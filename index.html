<title>Water Rings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap">
<style>
  /* Layout: full-bleed wooden slab; a stack of milky frosted cards floats at the left (bottom on phones), ending in a small square toggle */
  :root {
    --wood: #e9e5de;
    --card: rgba(244, 242, 237, 0.74);
    --card-line: rgba(255, 255, 255, 0.55);
    --tile: rgba(232, 231, 228, 0.92);
    --tile-hover: #ffffff;
    --pick: #ffc81a;
    --ink: #1c1c1b;
    --ink-dim: #6d6c69;
    --f-ui: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--wood);
    color: var(--ink);
    font-family: var(--f-ui);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: fixed; inset: 0; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #table { cursor: none; }

  .panel {
    position: fixed;
    left: 24px;
    top: 50%;
    transform: translateY(-50%);
    width: 292px;
    max-height: calc(100% - 32px);
    overflow-y: auto;
    scrollbar-width: none;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .panel::-webkit-scrollbar { display: none; }
  .card {
    width: 100%;
    display: grid; gap: 16px;
    padding: 22px 18px 18px;
    border-radius: 30px;
    background: var(--card);
    border: 1px solid var(--card-line);
    -webkit-backdrop-filter: blur(28px) saturate(1.4);
    backdrop-filter: blur(28px) saturate(1.4);
    box-shadow: 0 18px 40px rgba(40, 20, 5, 0.18);
  }
  .panel.collapsed .card { display: none; }

  h1 { margin: 0; font-size: 21px; font-weight: 400; letter-spacing: -0.01em; line-height: 1.2; }
  .hint { margin: 6px 0 0; font-size: 14px; font-weight: 300; line-height: 1.45; color: var(--ink-dim); text-wrap: pretty; }

  .section-head {
    appearance: none; border: 0; background: none; padding: 0; color: inherit; text-align: left;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    font: inherit; cursor: pointer;
  }
  .section-head h2 { margin: 0; font-size: 17px; font-weight: 400; line-height: 1.3; }
  .section-head .sub { display: block; margin-top: 2px; font-size: 15px; font-weight: 300; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .caret { width: 10px; height: 10px; margin-top: 12px; flex: none; transition: transform 0.2s; }
  .section-head[aria-expanded="false"] .caret { transform: rotate(180deg); }
  .section-head[aria-expanded="false"] + .grid { display: none; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tile {
    appearance: none; border: 0;
    position: relative;
    display: grid; place-items: center;
    border-radius: 18px;
    background: var(--tile);
    color: var(--ink);
    font: 300 13px/1 var(--f-ui);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .tile:hover { background: var(--tile-hover); }
  .tile:active { transform: scale(0.97); }
  .tile[aria-pressed="true"] { background: var(--pick); }
  .tile svg { display: block; }
  .cup-tile { height: 84px; }
  .cup-tile .label { position: absolute; top: 12px; left: 14px; color: var(--ink-dim); }
  .cup-tile[aria-pressed="true"] .label { color: rgba(28, 28, 27, 0.72); }
  .ctl-tile { height: 56px; }
  .ctl-tile .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .toggle {
    appearance: none; border: 1px solid var(--card-line);
    width: 52px; height: 52px; flex: none;
    display: grid; place-items: center;
    border-radius: 16px;
    background: var(--card);
    -webkit-backdrop-filter: blur(28px) saturate(1.4);
    backdrop-filter: blur(28px) saturate(1.4);
    box-shadow: 0 10px 24px rgba(40, 20, 5, 0.18);
    color: var(--ink);
    cursor: pointer;
  }
  .toggle:hover { background: rgba(255, 255, 255, 0.9); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .nogl { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 24px; text-align: center; font-size: 15px; line-height: 1.6; color: var(--ink); }

  @media (max-width: 640px) {
    .panel {
      left: 16px; right: 16px; width: auto;
      top: auto; transform: none;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      max-height: 70%;
      gap: 8px;
    }
    .card { padding: 16px 14px 14px; gap: 12px; border-radius: 24px; }
    .intro { display: none; }
    .cup-grid { grid-template-columns: repeat(6, 1fr); }
    .ctl-grid { grid-template-columns: repeat(4, 1fr); }
    .cup-tile { height: 64px; border-radius: 14px; }
    .cup-tile .label { top: auto; bottom: 7px; left: 0; right: 0; text-align: center; font-size: 11px; }
    .cup-tile svg { width: 30px; height: 30px; margin-top: -12px; }
    .ctl-tile { height: 48px; border-radius: 14px; }
    .section-head h2 { font-size: 15px; }
    .section-head .sub { font-size: 13px; }
    .toggle { width: 44px; height: 44px; border-radius: 14px; align-self: flex-end; }
  }
</style>

<div class="stage">
  <canvas id="table" aria-label="Wooden table. Press and hold to set a cup down; lift to leave a water mark."></canvas>
</div>

<aside class="panel" id="panel" aria-label="Controls">
  <section class="card">
    <div class="intro">
      <h1>Water rings</h1>
      <p class="hint" id="hint">Press and hold on the table to set the cup down, then lift it. The longer you hold, the darker the mark.</p>
    </div>
    <button class="section-head" type="button" aria-expanded="true" aria-controls="cupList">
      <span><h2>Cup</h2><span class="sub" id="cupName">Tumbler</span></span>
      <svg class="caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 2 9.5 8h-9z" fill="currentColor"/></svg>
    </button>
    <div class="grid cup-grid" id="cupList" role="group" aria-label="Choose a cup"></div>
  </section>

  <section class="card">
    <button class="section-head" type="button" aria-expanded="true" aria-controls="ctlList">
      <span><h2>Drying</h2><span class="sub" id="speedOut">Normal speed</span></span>
      <svg class="caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 2 9.5 8h-9z" fill="currentColor"/></svg>
    </button>
    <div class="grid ctl-grid" id="ctlList">
      <button class="tile ctl-tile" type="button" id="slower" title="Dry slower"><span class="label">Dry slower</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      <button class="tile ctl-tile" type="button" id="faster" title="Dry faster"><span class="label">Dry faster</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h14M10 3v14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      <button class="tile ctl-tile" type="button" id="pause" aria-pressed="false" title="Pause drying"><span class="label">Pause drying</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path id="pauseIcon" d="M7 4.5v11M13 4.5v11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg></button>
      <button class="tile ctl-tile" type="button" id="wipe" title="Wipe table"><span class="label">Wipe table</span>
        <svg width="22" height="20" viewBox="0 0 22 20" aria-hidden="true"><path d="M3 6c3-2 5 2 8 0s5-2 8 0M3 11c3-2 5 2 8 0s5-2 8 0M3 16c3-2 5 2 8 0s5-2 8 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg></button>
    </div>
  </section>

  <button class="toggle" id="toggle" type="button" aria-expanded="true" aria-controls="panel" title="Hide controls">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <g id="toggleIcon" fill="currentColor"><circle cx="4" cy="4" r="1.3"/><circle cx="14" cy="4" r="1.3"/><circle cx="9" cy="9" r="1.3"/><circle cx="4" cy="14" r="1.3"/><circle cx="14" cy="14" r="1.3"/></g>
    </svg>
  </button>
</aside>

<script>
(() => {
  // ---------- Cups ----------
  // R: base radius in CSS px (where the cup touches the table). look: extra scale for the drawn cup only, so the mark keeps its size.
  const CUPS = [
    { id: 'tumbler', name: 'Tumbler', R: 50, type: 0, wet: 1.0 },
    { id: 'mug',     name: 'Mug',     R: 46, type: 1, wet: 0.85, look: 1.2 },
    { id: 'rocks',   name: 'Rocks',   R: 44, type: 2, wet: 1.0, look: 1.2 },
    { id: 'ribbed',  name: 'Ribbed',  R: 46, type: 3, wet: 1.0, look: 1.2 },
    { id: 'bottle',  name: 'Bottle',  R: 38, type: 4, wet: 1.25, look: 1.2 },
    { id: 'finger',  name: 'Finger',  R: 15, type: 5, wet: 0 },   // stamps nothing; leads existing water out
  ];
  const SPEEDS = [0.35, 0.6, 1, 1.8, 3.2];
  const SPEED_NAMES = ['Very slow', 'Slow', 'Normal speed', 'Fast', 'Very fast'];
  const BASE_EVAP = 0.032;     // wetness units per second; a 1-second press (~0.65) fades in ~20 s
  const STAMP_RATE = 0.65;     // wetness added per second while the cup is down
  const CONTACT_BURST = 0.22;  // wetness added the instant the cup touches

  // ---------- GL setup ----------
  const canvas = document.getElementById('table');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false });
  if (!gl) {
    document.body.insertAdjacentHTML('beforeend', '<div class="nogl">This browser does not support WebGL2, so the table cannot be drawn.<br>Try a recent version of Chrome, Safari or Firefox.</div>');
    return;
  }
  const hasFloat = !!gl.getExtension('EXT_color_buffer_float');

  const NOISE = `
    float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x*p.y); }
    float vnoise(vec2 p){
      vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
      float a = hash(i), b = hash(i+vec2(1,0)), c = hash(i+vec2(0,1)), d = hash(i+vec2(1,1));
      return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
    }
    float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a*vnoise(p); p = p*2.03 + 17.1; a *= 0.5; } return s; }
  `;
  const VERT = `#version 300 es
    in vec2 aPos; out vec2 vUv;
    void main(){ vUv = aPos*0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

  // Wood: one whitewashed slab with warped grain, drawn once per resize.
  const WOOD = `#version 300 es
    precision highp float;
    in vec2 vUv; out vec4 o;
    uniform vec2 uRes; uniform float uDpr;
    ${NOISE}
    void main(){
      vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uDpr;
      // One continuous slab: long grain runs left to right, gently warped
      float warp = fbm(vec2(p.x*0.0016, p.y*0.006) + 4.0);
      float drift = sin(p.x*0.0022 + 1.3)*18.0 + sin(p.x*0.0007)*40.0;
      float y = p.y + drift + warp*70.0;
      float rings = sin(y*0.075 + fbm(vec2(p.x*0.003, y*0.01))*5.0);
      float band = smoothstep(-0.3, 1.0, rings);
      float wide = fbm(vec2(p.x*0.0009, y*0.004) + 9.0);
      float fine = vnoise(vec2(p.x*0.012, y*0.7));
      float pores = smoothstep(0.74, 0.92, vnoise(vec2(p.x*0.07, y*1.4) + 3.0));
      // whitewashed oak: pale base, grain showing through as soft warm grey
      vec3 lightW = vec3(0.955, 0.945, 0.925);
      vec3 darkW  = vec3(0.80, 0.765, 0.72);
      vec3 col = mix(lightW, darkW, band*0.42 + fine*0.2);
      col *= 0.96 + 0.06*wide;
      col *= 1.0 - pores*0.07;
      o = vec4(col, 1.0);
    }`;

  // Simulation: R = standing water, G = mineral residue left behind as the water evaporates.
  const SIM = `#version 300 es
    precision highp float;
    in vec2 vUv; out vec4 o;
    uniform sampler2D uPrev; uniform vec2 uPrevTexel; uniform vec2 uSize; uniform float uSimScale;
    uniform float uDt, uEvap, uDiff, uTime, uQuant;
    uniform float uStamp; uniform vec2 uCup; uniform float uR, uRot, uSeed; uniform int uType;
    uniform float uLine, uLineHW, uLineLevel; uniform vec2 uLineA, uLineB;   // rivulet the finger leads out this frame, sim px
    uniform float uDrain, uDrainR; uniform vec2 uDrainP;                     // water the rivulet draws from its source
    ${NOISE}
    float ring(float d, float hw, float aa){ return 1.0 - smoothstep(hw, hw + aa, abs(d)); }
    float sdBox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
    float cupMask(vec2 p){
      float aa = 1.4 / uR;
      vec2 sp = p + uSeed;
      float wob = (vnoise(sp*2.2) - 0.5)*0.09 + (vnoise(sp*6.5 + 3.1) - 0.5)*0.035;
      float thick = 0.45 + 1.1*vnoise(sp*3.7 + 11.0);
      float m = 0.0, d = 0.0;
      if (uType == 0) {            // tumbler: thin round ring
        d = length(p) - 1.0 + wob; m = ring(d, 0.045, aa);
      } else if (uType == 1) {     // mug: wide unglazed foot ring
        d = length(p) - 0.98 + wob*0.7; m = ring(d, 0.10, aa);
      } else if (uType == 2) {     // rocks glass: rounded square ring
        d = sdBox(p, vec2(0.92), 0.3) + wob; m = ring(d, 0.045, aa);
      } else if (uType == 3) {     // ribbed glass: the fluting leaves a finely rippled ring
        float a = atan(p.y, p.x);
        d = length(p) - (0.97 + 0.024*sin(a*48.0)) + wob*0.35;
        m = ring(d, 0.045, aa);
      } else {                     // soda bottle: five petaloid feet
        for (int i = 0; i < 5; i++) {
          float a = float(i)*1.2566 + 0.944;
          vec2 dir = vec2(cos(a), sin(a));
          vec2 q = p - 0.64*dir;
          float r = dot(q, dir), t = dot(q, vec2(-dir.y, dir.x));
          float dl = length(vec2(r*0.8, t*1.25)) - 0.17 + wob*0.6;
          m = max(m, 1.0 - smoothstep(0.0, aa, dl));
        }
        d = length(p) - 0.85;
      }
      m *= thick;
      if (uType != 1) {            // condensation that ran down the glass pools just outside the base
        float drops = smoothstep(0.66, 0.74, vnoise(sp*10.0 + uSeed*3.0));
        m += drops * step(0.03, d) * (1.0 - smoothstep(0.06, 0.32, d)) * 0.9;
      }
      return m;
    }
    void main(){
      vec2 px = vUv*uSize;
      vec4 c = texture(uPrev, vUv);
      float w = c.r, g = c.g;
      if (uDrain > 0.0) w *= 1.0 - uDrain*(1.0 - smoothstep(uDrainR*0.3, uDrainR, length(px - uDrainP)));
      float n = texture(uPrev, vUv + vec2(0.0, uPrevTexel.y)).r;
      float s = texture(uPrev, vUv - vec2(0.0, uPrevTexel.y)).r;
      float e = texture(uPrev, vUv + vec2(uPrevTexel.x, 0.0)).r;
      float wv = texture(uPrev, vUv - vec2(uPrevTexel.x, 0.0)).r;
      const float th = 0.004;
      float wn = step(th, n), ws = step(th, s), we = step(th, e), ww = step(th, wv);
      float edge = 0.0;
      if (w > th) {
        // Water only levels out between wet cells; the contact line stays pinned.
        float avg = (mix(w, n, wn) + mix(w, s, ws) + mix(w, e, we) + mix(w, wv, ww))*0.25;
        w += (avg - w)*uDiff;
        edge = (4.0 - (wn + ws + we + ww))*0.25;
      }
      float nz = fbm(px / uSimScale / 30.0 + 7.3);
      float ev = uEvap*uDt*(0.35 + 1.3*nz);
      float lost = min(ev, w);
      w -= lost;
      g += lost*(0.25 + 3.0*edge);
      g = max(g - uEvap*uDt*0.25, 0.0);
      if (uStamp > 0.0) {
        vec2 p = px - uCup; p.y = -p.y;
        float cs = cos(uRot), sn = sin(uRot);
        p = mat2(cs, -sn, sn, cs)*p / uR;
        w += cupMask(p)*uStamp;
      }
      if (uLine > 0.0) {
        // The finger leads water out as a thin rivulet with a crisp, slightly wavering edge.
        vec2 ab = uLineB - uLineA;
        float h = clamp(dot(px - uLineA, ab)/max(dot(ab, ab), 1e-4), 0.0, 1.0);
        float dist = length(px - (uLineA + ab*h)) + (vnoise(px/uSimScale*0.3) - 0.5)*uLineHW*0.7;
        w = max(w, (1.0 - smoothstep(uLineHW, uLineHW + 1.0, dist))*uLineLevel);
      }
      if (uQuant > 0.0) {
        w = max(w + (hash(px + fract(uTime)*91.7) - 0.5)*uQuant, 0.0);
        g = max(g + (hash(px.yx + fract(uTime)*53.1) - 0.5)*uQuant, 0.0);
      }
      o = vec4(min(w, 1.4), min(g, 1.0), 0.0, 1.0);
    }`;

  // Final pass: the table (wood, water, shadow, caustics) and the cup itself, drawn in one shader
  // so glass can refract whatever lies beneath it.
  const RENDER = `#version 300 es
    precision highp float;
    in vec2 vUv; out vec4 o;
    uniform sampler2D uWood, uWet; uniform vec2 uSimSize, uRes; uniform float uDpr;
    uniform vec2 uCupPos; uniform float uCupR, uCupRot, uLift; uniform int uCupType;
    uniform sampler2D uCupTex; uniform int uHasTex, uTexMode; uniform float uTexScale, uTexMaxR;
    uniform vec3 uTint; uniform float uTintAmt;   // colour the drink lends to the shadow and caustic
    ${NOISE}
    vec2 gCss; float gS;

    mat2 rotM(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
    float sdBox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
    vec2 uvToCss(vec2 uv){ return vec2(uv.x, 1.0 - uv.y)*gCss; }
    vec2 toLocal(vec2 p){ return rotM(uCupRot)*(p - uCupPos)/gS; }
    vec2 localToUvDelta(vec2 dl){ vec2 w = rotM(-uCupRot)*dl*gS; return vec2(w.x, -w.y)/gCss; }
    bool isGlass(){ return uCupType == 0 || uCupType == 2 || uCupType == 3 || uCupType == 4; }

    // ---- table ----
    vec2 wetAt(vec2 uv){
      vec2 t = uv*uSimSize - 0.5;
      vec2 f = fract(t); ivec2 i = ivec2(floor(t));
      ivec2 mx = ivec2(uSimSize) - 1;
      vec2 a = texelFetch(uWet, clamp(i, ivec2(0), mx), 0).rg;
      vec2 b = texelFetch(uWet, clamp(i + ivec2(1, 0), ivec2(0), mx), 0).rg;
      vec2 c = texelFetch(uWet, clamp(i + ivec2(0, 1), ivec2(0), mx), 0).rg;
      vec2 d = texelFetch(uWet, clamp(i + ivec2(1, 1), ivec2(0), mx), 0).rg;
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }
    vec3 tableAt(vec2 uv){
      vec2 ts = 1.0 / uSimSize;
      vec2 c = wetAt(uv);
      float w = c.x, g = c.y;
      float wl = wetAt(uv - vec2(ts.x, 0.0)).x, wr = wetAt(uv + vec2(ts.x, 0.0)).x;
      float wd = wetAt(uv - vec2(0.0, ts.y)).x, wu = wetAt(uv + vec2(0.0, ts.y)).x;
      vec2 grad = vec2(wr - wl, wu - wd)*0.5;
      float wet = smoothstep(0.0, 0.2, w);
      vec3 col = texture(uWood, uv - grad*10.0*uDpr / uRes).rgb;    // slight refraction at the meniscus
      col = mix(col, pow(col, vec3(1.6, 1.55, 1.45))*0.8, wet);      // soaked wood turns darker and a little cooler
      col *= 1.0 - clamp(length(grad)*3.0, 0.0, 1.0)*0.35*wet;       // darker rim
      col *= 1.0 - g*0.16;                                           // faint tide line left behind
      vec3 N = normalize(vec3(-grad*9.0, 1.0));
      vec3 L = normalize(vec3(-0.45, 0.55, 0.7));
      vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
      col += pow(max(dot(N, H), 0.0), 70.0)*0.55*wet;
      col += vec3(0.02, 0.025, 0.03)*wet;
      return col;
    }

    // ---- cup outline (top view), in units of the base radius ----
    float outline(vec2 q){
      if (uCupType == 0) return length(q) - 1.16;
      if (uCupType == 1) return min(length(q) - 1.12, abs(sdBox(q - vec2(1.26, 0.0), vec2(0.3), 0.16)) - 0.075);
      if (uCupType == 2) return sdBox(q, vec2(1.08), 0.34);
      if (uCupType == 3) return length(q) - (1.16 + 0.008*sin(atan(q.y, q.x)*72.0));
      if (uCupType == 4) return length(q) - 1.02;
      return length(q) - 1.0;
    }
    float baseSD(vec2 q){
      if (uCupType == 2) return sdBox(q, vec2(0.92), 0.3);
      if (uCupType == 3) return length(q) - 0.92;
      return length(q) - 1.0;
    }
    vec2 outN(vec2 q){ vec2 e = vec2(0.01, 0.0); return normalize(vec2(outline(q + e.xy) - outline(q - e.xy), outline(q + e.yx) - outline(q - e.yx)) + 1e-6); }
    vec2 baseN(vec2 q){ vec2 e = vec2(0.01, 0.0); return normalize(vec2(baseSD(q + e.xy) - baseSD(q - e.xy), baseSD(q + e.yx) - baseSD(q - e.yx)) + 1e-6); }

    // What lies under the cup: table plus the cup's shadow; glass also focuses a bright caustic into it.
    vec3 sceneBelow(vec2 uv){
      vec3 col = tableAt(uv);
      vec2 so = vec2(2.0 + 10.0*uLift, 3.0 + 14.0*uLift);
      float blur = 3.0 + 16.0*uLift;
      vec2 qs = toLocal(uvToCss(uv) - so);
      float sh;
      if (uHasTex == 1) {
        // Shadow cut from the photo's own silhouette, softened by sampling a blurrier mip level
        vec2 tuv = 0.5 + (uvToCss(uv) - so - uCupPos)/gS*uTexScale;
        // A coarse mip alone turns round cups blocky, so cap the level and blur with a ring of taps.
        float spread = blur*uTexScale/gS;
        float lod = clamp(log2(max(spread*512.0*0.35, 1.0)), 0.0, 3.5);
        float acc = textureLod(uCupTex, tuv, lod).a*2.0;
        for (int i = 0; i < 8; i++) {
          float a = float(i)*0.7854;
          acc += textureLod(uCupTex, tuv + vec2(cos(a), sin(a))*spread*0.6, lod).a;
        }
        sh = acc/10.0*(1.0 - smoothstep(0.44, 0.5, max(abs(tuv.x - 0.5), abs(tuv.y - 0.5))));
      } else {
        sh = 1.0 - smoothstep(-blur, blur, outline(qs)*gS);
      }
      bool glass = uHasTex == 1 ? uTexMode == 0 : isGlass();
      col *= 1.0 - sh*(uCupType == 5 ? 0.0 : glass ? 0.16 : 0.3);
      if (glass) {
        col *= mix(vec3(1.0), uTint, sh*uTintAmt);   // light passing through the drink picks up its colour
        float rs = uCupType == 2 ? sdBox(qs, vec2(0.62), 0.3) + 0.62 : length(qs);
        vec3 caustic = mix(vec3(1.0, 0.99, 0.96), uTint, uTintAmt*1.4);
        col += caustic*exp(-pow((rs - 0.64)/0.13, 2.0))*sh*0.26;
      }
      return col;
    }
    float windowRefl(vec2 q){
      vec2 w = rotM(-uCupRot)*q;
      return 1.0 - smoothstep(0.0, 0.06, sdBox(w - vec2(-0.34, -0.42), vec2(0.2, 0.09), 0.05));
    }

    void ice(vec2 q, vec2 c, float s, float a, vec2 L, inout vec2 off, inout float white, inout float dark, inout float glint){
      vec2 qi = rotM(a)*(q - c);
      float di = sdBox(qi, vec2(s*0.5), s*0.2);
      if (di < 0.0) {
        off += -qi*0.4 + vec2(0.02, 0.03);
        white = max(white, 0.1) + 0.22*(1.0 - smoothstep(-0.06, 0.0, di));
        float crack = 1.0 - smoothstep(0.0, 0.01, abs(qi.x*0.6 + qi.y + 0.04));
        white += crack*0.2*step(di, -0.05);

      dark += (1.0 - smoothstep(0.0, 0.015, abs(di)))*0.12;

    float bubbles(vec2 q, inout vec2 off){
      vec2 g = q*7.0; vec2 id = floor(g); vec2 f = fract(g) - 0.5;
      if (hash(id + 3.1) < 0.72) return 0.0;
      vec2 c = (vec2(hash(id + 1.7), hash(id + 8.3)) - 0.5)*0.5;
      float dd = length(f - c) - (0.06 + 0.07*hash(id + 5.5));
      if (dd < 0.0) off += (f - c)*0.05;
      return 1.0 - smoothstep(0.0, 0.05, abs(dd));

    vec3 capColor(vec2 q, vec2 L){
      float r = length(q)/0.34;
      vec2 n = normalize(q + 1e-5);
      vec3 c = vec3(0.965, 0.962, 0.955);
      c *= 1.0 - smoothstep(0.84, 0.9, r)*(0.5 + 0.5*sin(atan(q.y, q.x)*48.0))*0.08;
      c *= 0.92 + 0.08*(1.0 - r*r) + 0.06*dot(n, L)*r;
      c *= 1.0 - (1.0 - smoothstep(0.0, 0.06, 1.0 - r))*0.22;
      return c;
    }

    vec3 glassCup(vec2 q, float d, vec2 uv, vec2 L){
      float e = -d;
      float r = length(q);
      vec2 nO = outN(q);
      float bd = baseSD(q);
      vec2 nB = baseN(q);
      vec2 off = vec2(0.0);
      float white = 0.0, dark = 0.0, glint = 0.0, refl = 0.0;
      if (uCupType == 4) {                       // clear bottle seen from above

        if (r < 0.44) { off = normalize(q)*0.3; white = 0.34; }
        else {
          float t = (r - 0.44)/0.58;
          off = normalize(q)*(0.04 + 0.32*t*t);
          white = 0.05 + 0.12*t + 0.04*sin(r*60.0);
        }
        float lob = 1e3;                          // petaloid feet visible through the bottom
        for (int i = 0; i < 5; i++) {
          float a = float(i)*1.2566 + 0.944;
          vec2 dir = vec2(cos(a), sin(a));
          vec2 p = q - 0.6*dir;
          lob = min(lob, length(vec2(dot(p, dir)*0.8, dot(p, vec2(-dir.y, dir.x))*1.25)) - 0.17);
        }
        dark += (1.0 - smoothstep(0.0, 0.025, abs(lob)))*0.2;
        glint += pow(max(dot(normalize(q), L), 0.0), 8.0)*smoothstep(0.6, 0.95, r)*0.25;
      } else if (bd > 0.0) {                     // tilted side wall between base and rim
        float t = clamp(bd/max(bd - d, 1e-3), 0.0, 1.0);
        off = nB*(0.06 + 0.22*t);
        white = 0.08 + 0.22*t;
        if (uCupType == 3) {                     // ribbed wall: each flute bends light its own way
          float a = atan(q.y, q.x);
          float k = floor(a*48.0/6.28318);
          float fa = (k + 0.5)*6.28318/48.0;
          vec2 fd = vec2(cos(fa), sin(fa));
          off = fd*(0.1 + 0.18*hash(vec2(k, 2.0)));
          white = 0.1 + 0.25*hash(vec2(k, 9.0));
          glint += pow(max(dot(fd, L), 0.0), 10.0)*0.5;
        }
        vec2 g = q*11.0; vec2 id = floor(g); vec2 f = fract(g) - 0.5;   // condensation beads
        if (hash(id + 4.2) > 0.5) {
          vec2 c = (vec2(hash(id + 1.3), hash(id + 6.1)) - 0.5)*0.4;
          float rad = 0.12 + 0.18*hash(id + 2.9);
          float dd = length(f - c) - rad;
          if (dd < 0.0) {
            off -= (f - c)*0.25;
            white += 0.1;
            glint += pow(max(dot(normalize(f - c + 1e-4), L), 0.0), 6.0)*0.45*smoothstep(-rad, 0.0, dd);
          }
          dark += (1.0 - smoothstep(0.0, 0.06, abs(dd)))*0.12;
        }
      } else {                                   // through the water and the thick base
        float heavy = uCupType == 2 ? 1.6 : 1.0;
        off = -q*0.05 + nB*0.12*heavy*smoothstep(-0.2*heavy, 0.0, bd);
        dark = exp(-pow((bd + 0.02)/0.02, 2.0))*0.3;
        white = 0.03 + exp(-pow((bd + 0.07*heavy)/0.03, 2.0))*0.16;
        if (uCupType == 0) {
          ice(q, vec2(-0.32, -0.16), 0.46, 0.4, L, off, white, dark, glint);
          ice(q, vec2(0.3, -0.24), 0.42, -0.3, L, off, white, dark, glint);
          ice(q, vec2(0.02, 0.36), 0.44, 0.9, L, off, white, dark, glint);
        } else if (uCupType == 3) {
          ice(q, vec2(-0.22, -0.12), 0.42, 0.6, L, off, white, dark, glint);
          ice(q, vec2(0.24, 0.16), 0.4, -0.2, L, off, white, dark, glint);
        } else if (uCupType == 2) {              // one large clear ice sphere
          vec2 sc = q - vec2(0.05, -0.05);
          float rs = length(sc)/0.58;
          if (rs < 1.0) {
            off += -sc*0.55*(1.0 + rs);
            white = 0.1 + 0.26*exp(-rs*rs*3.0) + 0.3*smoothstep(0.82, 1.0, rs);
            vec2 hp = sc - L*0.3;
            glint += exp(-dot(hp, hp)/0.004)*0.7;
          }
          dark += (1.0 - smoothstep(0.0, 0.015, abs(rs - 1.0)*0.58))*0.15;
        }
        white += bubbles(q, off)*0.35;
        refl = windowRefl(q);
      }
      vec3 c = sceneBelow(uv + localToUvDelta(off));
      c = mix(c, vec3(1.0), clamp(white, 0.0, 0.9));
      c *= 1.0 - dark;
      float facing = dot(nO, L);
      float lip = 1.0 - smoothstep(0.0, 0.045, e);
      c = mix(c, vec3(1.0), lip*(0.5 + 0.4*max(facing, 0.0)));
      c *= 1.0 - (1.0 - smoothstep(0.0, 0.015, e))*0.28;
      c += smoothstep(0.3, 1.0, facing)*(1.0 - smoothstep(0.03, 0.14, e))*0.35;
      c += smoothstep(0.3, 1.0, -facing)*(1.0 - smoothstep(0.02, 0.08, e))*0.08;
      c += refl*0.14 + glint;
      return c;
    }

    vec3 mugColor(vec2 q, vec2 L){          // fallback drawing until the mug photo decodes
      vec3 W = vec3(0.97, 0.965, 0.955);
      float r = length(q);
      vec2 n = normalize(q + 1e-5);
      if (r > 1.12) {
        float t = clamp((abs(sdBox(q - vec2(1.26, 0.0), vec2(0.3), 0.16)))/0.075, 0.0, 1.0);
        float nz = sqrt(1.0 - t*t);
        return W*(0.78 + 0.2*nz) + pow(nz, 8.0)*0.03;
      }
      if (r > 1.0) {
        float t = (r - 1.06)/0.06;
        float nz = sqrt(max(1.0 - t*t, 0.0));
        vec3 N = normalize(vec3(n*t, nz));
        float spec = pow(max(dot(N, normalize(vec3(L, 1.4))), 0.0), 40.0);
        return W*(0.84 + 0.1*nz + 0.12*dot(n*t, L)) + spec*0.1;
      }
      if (r > 0.9) {
        float t = (1.0 - r)/0.1;
        return W*(0.74 + 0.1*t + 0.12*(0.5 + 0.5*dot(-n, L)));
      }
      vec2 off = vec2(0.0); float white = 0.0, dark = 0.0, glint = 0.0;
      ice(q, vec2(-0.26, -0.18), 0.4, 0.5, L, off, white, dark, glint);
      ice(q, vec2(0.26, 0.2), 0.38, -0.4, L, off, white, dark, glint);
      vec3 c = W*0.9*(1.0 - 0.12*smoothstep(0.55, 0.9, r));
      c *= 1.0 - 0.14*smoothstep(0.4, 0.9, r)*max(dot(n, L), 0.0);
      c = mix(c, vec3(1.0), clamp(white, 0.0, 0.8)*0.5);
      c *= 1.0 - dark;
      return c + windowRefl(q)*0.08 + glint;
    }

    vec3 fingerColor(vec2 q, float d, vec2 uv){   // a plain translucent 2D disc
      vec3 c = mix(sceneBelow(uv), vec3(1.0), 0.45);
      return c*(1.0 - (1.0 - smoothstep(0.0, 0.08, -d))*0.12);
    }

    void main(){
      gCss = uRes / uDpr;
      gS = uCupR*(uCupType == 5 ? 1.0 : 1.0 + 0.06*uLift);
      vec2 q = toLocal(uvToCss(vUv));
      float d = outline(q);
      vec3 col = sceneBelow(vUv);
      float aa = 1.0/gS;
      if (uHasTex == 1) {
        vec2 qw = rotM(-uCupRot)*q;                 // keep the photo's lighting fixed to the room
        vec2 tuv = 0.5 + qw*uTexScale;
        // Explicit mip level: implicit derivatives are undefined inside the branches below.
        float lod = log2(max(uTexScale*512.0/(gS*uDpr), 1e-3));
        {
          vec4 t = textureLod(uCupTex, tuv, lod);
          t.a *= step(max(abs(tuv.x - 0.5), abs(tuv.y - 0.5)), 0.499);
          t.a *= smoothstep(0.02, 0.08, t.a)*(1.0 - smoothstep(uTexMaxR - 0.03, uTexMaxR, length(qw)));
          if (t.a > 0.0) {
            vec3 cc;
            if (uTexMode == 0) {
              // Glass shot on white: a transmission filter over whatever is below,
              // with its brightness gradients bending the table seen through it.
              float ts = 1.5/512.0;
              vec3 lw = vec3(0.299, 0.587, 0.114);
              float lx = dot(textureLod(uCupTex, tuv + vec2(ts, 0.0), lod).rgb - textureLod(uCupTex, tuv - vec2(ts, 0.0), lod).rgb, lw);
              float ly = dot(textureLod(uCupTex, tuv + vec2(0.0, ts), lod).rgb - textureLod(uCupTex, tuv - vec2(0.0, ts), lod).rgb, lw);
              vec2 offW = -vec2(lx, ly)*0.35 - qw*0.04;
              cc = sceneBelow(vUv + localToUvDelta(rotM(uCupRot)*offW))*min(t.rgb*1.08, vec3(1.0));
              cc += smoothstep(0.82, 1.0, dot(t.rgb, lw))*0.07;
            } else {
              cc = t.rgb;                           // opaque porcelain: the photo as is
            }
            col = mix(col, cc, t.a);
          }
        }
      } else if (d < aa) {
        vec2 L = rotM(uCupRot)*normalize(vec2(-0.7, -0.7));
        vec3 cc;
        if (uCupType == 1) cc = mugColor(q, L);
        else if (uCupType == 5) cc = fingerColor(q, d, vUv);
        else cc = glassCup(q, d, vUv, L);
        col = mix(col, cc, 1.0 - smoothstep(-aa, aa, d));
      }
      vec2 v = vUv - 0.5; v.x *= uRes.x / uRes.y;
      col *= 1.0 - dot(v, v)*0.16;
      col *= 0.97 + 0.05*(1.0 - length(vUv - vec2(0.25, 0.85)));
      o = vec4(col, 1.0);
    }`;


  function compile(type, src) {

    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const locs = {};
    return { p, u: (name) => (name in locs ? locs[name] : (locs[name] = gl.getUniformLocation(p, name))) };
  }
  const progWood = program(WOOD), progSim = program(SIM), progRender = program(RENDER);

  // Photographed cups. scale maps base radii to texture uv; maxR clips stray pixels (base radii);
  // mode 0 = glass shot on white (multiplied over the table), 1 = opaque.
  // Until a photo decodes, that cup falls back to its procedural drawing.
  const PHOTOS = {
    tumbler: { el: 'img-tumbler', scale: (494.5 / 1300) / 1.16, maxR: 1.18, mode: 0 },
    ribbed:  { el: 'img-ribbed',  scale: (452 / 1200) / 1.16, maxR: 1.2, mode: 0 },
    bottle:  { el: 'img-bottle',  scale: (450 / 1240) / 1.02, maxR: 9, mode: 0, tint: [0.85, 0.5, 0.35], tintAmt: 0.5 },
    rocks:   { el: 'img-rocks',   scale: (458 / 1280) / 1.08, maxR: 9, mode: 0, tint: [1.0, 0.74, 0.4], tintAmt: 0.55 },
    mug:     { el: 'img-mug',     scale: (441 / 1400) / 1.12, maxR: 9, mode: 1 },
  };
  for (const ph of Object.values(PHOTOS)) {
    const img = new Image();
    img.onload = () => {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      ph.tex = t;
    };
    img.src = document.getElementById(ph.el).textContent.trim();
  }

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  let useFloat = hasFloat;
  function target(w, h, float) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    if (float) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const filter = float ? gl.NEAREST : gl.LINEAR;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    return { tex, fbo, w, h, ok };
  }
  function freeTarget(t) { if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); } }
  function simTarget(w, h) {
    let t = target(w, h, useFloat);
    if (!t.ok && useFloat) { freeTarget(t); useFloat = false; t = target(w, h, false); }
    return t;
  }

  // ---------- Sizing ----------
  let cssW = 0, cssH = 0, dpr = 1, simScale = 0.75;
  let simA = null, simB = null, wood = null;
  let time = 0;

  function runSim(src, dst, o) {
    gl.useProgram(progSim.p);
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
    gl.viewport(0, 0, dst.w, dst.h);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    const u = progSim.u;
    gl.uniform1i(u('uPrev'), 0);
    gl.uniform2f(u('uPrevTexel'), 1 / src.w, 1 / src.h);
    gl.uniform2f(u('uSize'), dst.w, dst.h);
    gl.uniform1f(u('uSimScale'), simScale);
    gl.uniform1f(u('uDt'), o.dt || 0);
    gl.uniform1f(u('uEvap'), o.evap || 0);
    gl.uniform1f(u('uDiff'), o.diff || 0);
    gl.uniform1f(u('uTime'), time);
    gl.uniform1f(u('uQuant'), useFloat || o.copy ? 0 : 1 / 255);
    gl.uniform1f(u('uStamp'), o.stamp || 0);
    if (o.stamp) {
      const cup = CUPS[o.cup];
      gl.uniform2f(u('uCup'), o.x * simScale, (cssH - o.y) * simScale);
      gl.uniform1f(u('uR'), cup.R * simScale);
      gl.uniform1f(u('uRot'), o.rot);
      gl.uniform1f(u('uSeed'), o.seed);
      gl.uniform1i(u('uType'), cup.type);
    }
    gl.uniform1f(u('uLine'), o.line ? 1 : 0);
    if (o.line) {
      const [ax, ay, bx, by, hw, level] = o.line;
      gl.uniform2f(u('uLineA'), ax * simScale, (cssH - ay) * simScale);
      gl.uniform2f(u('uLineB'), bx * simScale, (cssH - by) * simScale);
      gl.uniform1f(u('uLineHW'), hw * simScale);
      gl.uniform1f(u('uLineLevel'), level);
    }
    gl.uniform1f(u('uDrain'), o.drain ? o.drain[3] : 0);
    if (o.drain) {
      gl.uniform2f(u('uDrainP'), o.drain[0] * simScale, (cssH - o.drain[1]) * simScale);
      gl.uniform1f(u('uDrainR'), o.drain[2] * simScale);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function step(o) { runSim(simA, simB, o); [simA, simB] = [simB, simA]; }

  // Wettest value in a small patch of the table under (x, y), in CSS px.
  const probeF = new Float32Array(4 * 25), probeB = new Uint8Array(4 * 25);
  function wetAtPoint(x, y) {
    const sx = Math.round(x * simScale) - 2, sy = Math.round((cssH - y) * simScale) - 2;
    if (sx < 0 || sy < 0 || sx + 5 > simA.w || sy + 5 > simA.h) return 0;
    gl.bindFramebuffer(gl.FRAMEBUFFER, simA.fbo);
    let m = 0;
    if (useFloat) { gl.readPixels(sx, sy, 5, 5, gl.RGBA, gl.FLOAT, probeF); for (let i = 0; i < 100; i += 4) m = Math.max(m, probeF[i]); }
    else { gl.readPixels(sx, sy, 5, 5, gl.RGBA, gl.UNSIGNED_BYTE, probeB); for (let i = 0; i < 100; i += 4) m = Math.max(m, probeB[i] / 255); }
    return m;
  }

  function resize() {
    cssW = Math.max(1, window.innerWidth);
    cssH = Math.max(1, window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.round(cssW * dpr), H = Math.round(cssH * dpr);
    canvas.width = W;
    canvas.height = H;

    simScale = Math.min(1, 1600 / Math.max(cssW, cssH));
    const sw = Math.max(2, Math.round(cssW * simScale)), sh = Math.max(2, Math.round(cssH * simScale));
    const nA = simTarget(sw, sh), nB = simTarget(sw, sh);
    if (simA) { runSim(simA, nA, { copy: true }); freeTarget(simA); freeTarget(simB); }
    simA = nA; simB = nB;

    freeTarget(wood);
    wood = target(W, H, false);
    gl.useProgram(progWood.p);
    gl.bindFramebuffer(gl.FRAMEBUFFER, wood.fbo);
    gl.viewport(0, 0, W, H);
    gl.uniform2f(progWood.u('uRes'), W, H);
    gl.uniform1f(progWood.u('uDpr'), dpr);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function render() {
    gl.useProgram(progRender.p);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, wood.tex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, simA.tex);
    const u = progRender.u;
    gl.uniform1i(u('uWood'), 0);
    gl.uniform1i(u('uWet'), 1);
    gl.uniform2f(u('uSimSize'), simA.w, simA.h);
    gl.uniform2f(u('uRes'), canvas.width, canvas.height);
    gl.uniform1f(u('uDpr'), dpr);
    const cup = CUPS[st.cup];
    gl.uniform2f(u('uCupPos'), st.x, st.y);
    gl.uniform1f(u('uCupR'), cup.R * (cup.look || 1));
    gl.uniform1f(u('uCupRot'), st.rot);
    gl.uniform1f(u('uLift'), 1 - st.down);
    gl.uniform1i(u('uCupType'), cup.type);
    const ph = PHOTOS[cup.id];
    const hasTex = !!(ph && ph.tex);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, hasTex ? ph.tex : null);
    gl.uniform1i(u('uCupTex'), 2);
    gl.uniform1i(u('uHasTex'), hasTex ? 1 : 0);
    const tint = (hasTex && ph.tint) || [1, 1, 1];
    gl.uniform3f(u('uTint'), tint[0], tint[1], tint[2]);
    gl.uniform1f(u('uTintAmt'), hasTex && ph.tint ? ph.tintAmt : 0);
    if (hasTex) {
      gl.uniform1i(u('uTexMode'), ph.mode);
      gl.uniform1f(u('uTexScale'), ph.scale);
      gl.uniform1f(u('uTexMaxR'), ph.maxR);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // ---------- State & input ----------
  const st = { cup: 0, x: 0, y: 0, tx: 0, ty: 0, rot: 0.3, pressed: false, down: 0, burst: 0, seed: 0, presses: 0 };
  let speedIdx = 2, wipe = 0, pointerId = null;

  function pressCup() {
    if (st.pressed) return;
    st.pressed = true;
    st.seed = Math.random() * 100;
    st.burst = CONTACT_BURST;
    st.lx = st.tx; st.ly = st.ty;   // a finger stroke starts where it touches down, dry
    st.load = 0;
    st.presses++;
  }
  function liftCup() { st.pressed = false; pointerId = null; }

  canvas.addEventListener('pointerdown', (e) => {
    pointerId = e.pointerId;
    st.pressed = false;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }
    st.tx = e.clientX; st.ty = e.clientY;
    if (e.pointerType !== 'mouse') { st.x = st.tx; st.y = st.ty; }
    pressCup();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (pointerId !== null && e.pointerId !== pointerId) return;
    st.tx = e.clientX; st.ty = e.clientY;
  });
  const end = (e) => { if (e.pointerId === pointerId) liftCup(); };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('lostpointercapture', end);
  window.addEventListener('pointerup', end);
  window.addEventListener('blur', liftCup);

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat && document.activeElement === document.body) { e.preventDefault(); pressCup(); }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= CUPS.length && !st.pressed) selectCup(n - 1);
  });
  window.addEventListener('keyup', (e) => { if (e.code === 'Space') liftCup(); });

  // Panel: each cup tile shows the mark it leaves, drawn as a small pictogram
  function footprint(cup) {
    const ink = 'currentColor';
    const ring = (r, w) => `<circle cx="20" cy="20" r="${r}" fill="none" stroke="${ink}" stroke-width="${w}"/>`;
    const dots = (n, r, size, off = 0) => Array.from({ length: n }, (_, k) => {
      const a = off + (k / n) * Math.PI * 2;
      return `<circle cx="${(20 + Math.cos(a) * r).toFixed(2)}" cy="${(20 + Math.sin(a) * r).toFixed(2)}" r="${size}" fill="${ink}"/>`;
    }).join('');
    let body = '';
    if (cup.id === 'tumbler') body = ring(12, 1.3);
    else if (cup.id === 'mug') body = ring(11, 3.6);
    else if (cup.id === 'rocks') body = `<rect x="8.5" y="8.5" width="23" height="23" rx="6" fill="none" stroke="${ink}" stroke-width="1.3"/>`;
    else if (cup.id === 'ribbed') {
      const pts = Array.from({ length: 192 }, (_, k) => {
        const a = (k / 192) * Math.PI * 2, r = 12 + 0.9 * Math.sin(a * 24);
        return `${(20 + Math.cos(a) * r).toFixed(2)},${(20 + Math.sin(a) * r).toFixed(2)}`;
      }).join(' ');
      body = `<polygon points="${pts}" fill="none" stroke="${ink}" stroke-width="1.2" stroke-linejoin="round"/>`;
    }
    else if (cup.id === 'bottle') body = dots(5, 9, 2.4, -Math.PI / 2);
    else if (cup.id === 'finger') body = `<g fill="none" stroke="${ink}" stroke-width="1.2" stroke-linecap="round"><path d="M13 28c-1.4-2.6-2-5.3-2-8.5a9 9 0 0 1 18 0c0 3.2-.6 5.9-2 8.5"/><path d="M16.5 28c-1-2.2-1.5-4.8-1.5-8.5a5 5 0 0 1 10 0c0 3.7-.5 6.3-1.5 8.5"/><path d="M20 28v-8.5"/></g>`;
    return `<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">${body}</svg>`;
  }

  const list = document.getElementById('cupList');
  const cupName = document.getElementById('cupName');
  const buttons = CUPS.map((cup, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tile cup-tile';
    b.setAttribute('aria-pressed', i === st.cup ? 'true' : 'false');
    b.title = `${cup.name} (${i + 1})`;
    b.innerHTML = `<span class="label">${cup.name}</span>${footprint(cup)}`;
    b.addEventListener('click', () => selectCup(i));
    list.append(b);
    return b;
  });
  function selectCup(i) {
    st.cup = i;
    cupName.textContent = CUPS[i].name;
    hint.textContent = CUPS[i].id === 'finger' ? HINTS.finger : hintShown ? HINTS.after : HINTS.start;
    buttons.forEach((b, j) => b.setAttribute('aria-pressed', j === i ? 'true' : 'false'));
  }

  document.querySelectorAll('.section-head').forEach((h) => {
    h.addEventListener('click', () => h.setAttribute('aria-expanded', h.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'));
  });

  let paused = false;
  const speedOut = document.getElementById('speedOut');
  const pauseBtn = document.getElementById('pause'), pauseIcon = document.getElementById('pauseIcon');
  function showSpeed() {
    speedOut.textContent = paused ? 'Paused' : SPEED_NAMES[speedIdx];
    pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
    pauseBtn.title = paused ? 'Resume drying' : 'Pause drying';
    pauseIcon.setAttribute('d', paused ? 'M7 4.5 15.5 10 7 15.5Z' : 'M7 4.5v11M13 4.5v11');
    pauseIcon.setAttribute('fill', paused ? 'currentColor' : 'none');
  }
  document.getElementById('slower').addEventListener('click', () => { speedIdx = Math.max(0, speedIdx - 1); paused = false; showSpeed(); });
  document.getElementById('faster').addEventListener('click', () => { speedIdx = Math.min(SPEEDS.length - 1, speedIdx + 1); paused = false; showSpeed(); });
  pauseBtn.addEventListener('click', () => { paused = !paused; showSpeed(); });
  document.getElementById('wipe').addEventListener('click', () => { wipe = 1.1; });

  const panel = document.getElementById('panel'), toggle = document.getElementById('toggle');
  toggle.addEventListener('click', () => {
    const open = panel.classList.toggle('collapsed') === false;
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.title = open ? 'Hide controls' : 'Show controls';
  });

  const hint = document.getElementById('hint');
  const HINTS = {
    start: hint.textContent,
    after: 'Marks fade as the water dries. Try another cup, or stamp over the same spot.',
    finger: 'Touch a wet mark and drag to lead the water out in that direction.',
  };
  let hintShown = 0;

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now; time += dt;

    if (st.pressed) { st.x = st.tx; st.y = st.ty; }
    else {
      const k = 1 - Math.exp(-dt * 22);
      const dx = (st.tx - st.x) * k;
      st.x += dx; st.y += (st.ty - st.y) * k;
      st.rot += dx * 0.0025;
    }
    st.down += ((st.pressed ? 1 : 0) - st.down) * (1 - Math.exp(-dt * (st.pressed ? 30 : 14)));

    let evap = paused ? 0 : BASE_EVAP * SPEEDS[speedIdx];
    if (wipe > 0) { wipe -= dt; evap = BASE_EVAP * 30; }

    let stamp = 0;
    if (st.pressed) {
      stamp = (STAMP_RATE * dt + st.burst) * CUPS[st.cup].wet;
      st.burst = 0;
    }
    // Photographed cups are always drawn upright, so their mark must be upright too.
    const photoCup = PHOTOS[CUPS[st.cup].id];
    const stampRot = photoCup && photoCup.tex ? 0 : st.rot;
    // Finger: touching water loads it up; moving then leads a rivulet out until the load runs dry.
    // The rivulet thins and fades as the load runs out, and the mark it came from gives up water.
    let line = null, drain = null;
    if (st.pressed && CUPS[st.cup].id === 'finger') {
      const wv = wetAtPoint(st.x, st.y);
      if (wv > 0.08) {
        st.load = Math.max(st.load, 180 * Math.min(1, wv / 0.5));
        st.srcX = st.x; st.srcY = st.y;
      }
      const dist = Math.hypot(st.x - st.lx, st.y - st.ly);
      if (st.load > 0 && dist > 0) {
        const t = Math.min(1, st.load / 180);
        line = [st.lx, st.ly, st.x, st.y, 0.8 + 1.8 * t, 0.03 + 0.25 * t];
        drain = [st.srcX, st.srcY, CUPS[st.cup].R * 3, Math.min(0.06, dist * 0.004)];
        st.load = Math.max(0, st.load - dist);
      }
    }
    st.lx = st.x; st.ly = st.y;
    step({ dt, evap, diff: 1 - Math.exp(-dt * 3), stamp, cup: st.cup, x: st.x, y: st.y, rot: stampRot, seed: st.seed, line, drain });
    render();

    if (st.presses === 1 && !st.pressed && hintShown === 0) {
      hintShown = 1;
      if (CUPS[st.cup].id !== 'finger') hint.textContent = HINTS.after;
    }
    requestAnimationFrame(frame);
  }

  function seedTable() {
    const marks = [
      { cup: 0, fx: 0.46, fy: 0.3, amt: 0.85 },
      { cup: 3, fx: 0.8, fy: 0.62, amt: 0.75 },
      { cup: 4, fx: 0.84, fy: 0.24, amt: 0.9 },
    ];
    for (const m of marks) {
      const rot = PHOTOS[CUPS[m.cup].id] ? 0 : Math.random() * 6.28;   // photographed cups are drawn upright
      step({ stamp: m.amt * CUPS[m.cup].wet, cup: m.cup, x: m.fx * cssW, y: m.fy * cssH, rot, seed: Math.random() * 100 });
    }
  }

  window.addEventListener('resize', resize);
  resize();
  st.x = st.tx = cssW * (cssW > 640 ? 0.66 : 0.6);
  st.y = st.ty = cssH * 0.58;
  seedTable();
  requestAnimationFrame(frame);
})();
</script>
